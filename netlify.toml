[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to the Render backend server to avoid CORS issues and keep endpoints clean
[[redirects]]
  from = "/api/*"
  to = "https://galaxy-server-tqwm.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing — redirect all other paths to index.html so React Router works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
